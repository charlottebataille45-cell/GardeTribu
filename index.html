<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garde Tribu</title>
  <style>
    :root { --bg: #f4f6f8; --card: #ffffff; --primary: #4CAF50; --border: #e2e8f0; --accent: #2196F3; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #2d3748; padding: 12px; margin: 0; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 480px; margin: 0 auto; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; color: #4a5568; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
    
    /* Boutons Puces Enfants */
    .puces-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .puce-btn { padding: 6px 12px; border: 2px solid transparent; border-radius: 16px; background: #edf2f7; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.15s; }
    .puce-btn.selected { color: white !important; }

    /* Raccourcis temps */
    .shortcuts { display: flex; gap: 6px; margin-top: 4px; }
    .shortcut-btn { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
    .shortcut-btn:hover { background: #cbd5e0; }

    /* Accordéon */
    details { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 12px; background: #fafafa; }
    summary { font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--accent); }

    .btn-submit { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 14px; }
    #loading { text-align: center; padding: 30px; font-weight: 600; }
    #app { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div id="loading">⏳ Chargement...</div>
  
  <div id="app">
    <form id="eventForm">
      
      <!-- Enfants (Aucun sélectionné par défaut) -->
      <div class="form-group">
        <label>Pour qui ?</label>
        <div class="puces-grid" id="enfantsContainer"></div>
      </div>

      <!-- Type & Responsable (Puces dynamiques) -->
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Type</label>
          <select id="typeSelect" required></select>
        </div>
        <div class="form-group" style="flex: 1.2;">
          <label>Responsable</label>
          <select id="intervenantSelect" required></select>
        </div>
      </div>

      <!-- Date & Raccourcis -->
      <div class="form-group">
        <label>Date</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="date" id="dateInput" required>
          <button type="button" class="shortcut-btn" onclick="setDate('aujourdhui')">Aujourd'hui</button>
          <button type="button" class="shortcut-btn" onclick="setDate('demain')">Demain</button>
        </div>
      </div>

      <!-- Heures & Durée -->
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Début</label>
          <input type="time" id="heureDebutInput" value="17:00" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Fin</label>
          <input type="time" id="heureFinInput" value="18:00" required>
        </div>
      </div>
      <div class="shortcuts" style="margin-bottom: 12px;">
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(30)">+30 min</button>
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(60)">+1h</button>
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(120)">+2h</button>
        <button type="button" class="shortcut-btn" onclick="setJournee()">Journée</button>
      </div>

      <!-- Accordéon Plus d'options -->
      <details>
        <summary>+ Plus d'options (Lieu, Notes, Récurrence)</summary>
        <div style="padding-top: 10px;">
          
          <div class="form-group">
            <label>Lieu</label>
            <select id="lieuSelect"><option value="">-- Aucun --</option></select>
          </div>

          <div class="form-group">
            <label>Notes / Détails</label>
            <textarea id="notesInput" rows="2" placeholder="Précisions..."></textarea>
          </div>

          <!-- Récurrence pour BDD_Series -->
          <div style="border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="recurrentCheck" style="width: auto;" onchange="toggleRecurrenceUI()">
              Répéter cet événement (Série)
            </label>
            
            <div id="recurrenceOptions" style="display: none; margin-top: 8px; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
              <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                <select id="frequenceUnite">
                  <option value="Semaines">Chaque semaine</option>
                  <option value="Jours">Chaque jour</option>
                </select>
              </div>
              <label>Jusqu'au :</label>
              <input type="date" id="dateFinRecurrence">
            </div>
          </div>

        </div>
      </details>

      <button type="submit" class="btn-submit" id="submitBtn">Enregistrer</button>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQDj9KEekj0b3kXZlQhfuFKZa8p5bNgSkrS-oJJ6yoDpInhN2UxLV-F8xxQ2KspwrNzw/exec";
  let appData = null;
  const enfantsSelectionnes = new Set(); // Vide par défaut

  window.onload = () => {
    chargerDonnees();
    setDate('aujourdhui');
  };

  function chargerDonnees() {
    fetch(`${SCRIPT_URL}?action=getPlanningData`, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(data => {
        appData = data.referentiels;
        construireInterface();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      });
  }

  function construireInterface() {
    // Enfants
    const container = document.getElementById('enfantsContainer');
    appData.enfants.forEach(e => {
      if (e.actif === "Oui") {
        const btn = document.createElement('div');
        btn.className = 'puce-btn';
        btn.innerText = `${e.emoji} ${e.prenom}`;
        btn.style.borderColor = e.couleur;
        btn.style.color = e.couleur;
        btn.onclick = () => {
          if (enfantsSelectionnes.has(e.id)) {
            enfantsSelectionnes.delete(e.id);
            btn.classList.remove('selected');
            btn.style.backgroundColor = 'transparent';
            btn.style.color = e.couleur;
          } else {
            enfantsSelectionnes.add(e.id);
            btn.classList.add('selected');
            btn.style.backgroundColor = e.couleur;
          }
          mettreAJourIntervenants();
        };
        container.appendChild(btn);
      }
    });

    // Types
    const typeSelect = document.getElementById('typeSelect');
    appData.types.forEach(t => typeSelect.add(new Option(t, t)));

    // Lieux
    if (appData.lieux) {
      const lieuSelect = document.getElementById('lieuSelect');
      appData.lieux.forEach(l => lieuSelect.add(new Option(l.nom, l.id)));
    }

    mettreAJourIntervenants();
  }

  function mettreAJourIntervenants() {
    const select = document.getElementById('intervenantSelect');
    select.innerHTML = '<option value="">-- Choisir --</option>';
    appData.intervenants.forEach(i => {
      const intervId = i.id || i.nom;
      select.add(new Option(i.nom, intervId));
    });
  }

  // --- RACCOURCIS ET UTILITAIRES DATES ---
  function setDate(choix) {
    const d = new Date();
    if (choix === 'demain') d.setDate(d.getDate() + 1);
    document.getElementById('dateInput').value = d.toISOString().split('T')[0];
  }

  function ajouterDuree(minutes) {
    const hDebut = document.getElementById('heureDebutInput').value;
    if (!hDebut) return;
    const [h, m] = hDebut.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m + minutes);
    const hFin = String(d.getHours()).padStart(2, '0');
    const mFin = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('heureFinInput').value = `${hFin}:${mFin}`;
  }

  function setJournee() {
    document.getElementById('heureDebutInput').value = "08:00";
    document.getElementById('heureFinInput').value = "18:00";
  }

  function toggleRecurrenceUI() {
    const isChecked = document.getElementById('recurrentCheck').checked;
    document.getElementById('recurrenceOptions').style.display = isChecked ? 'block' : 'none';
  }

  // --- SOUMISSION ---
  document.getElementById('eventForm').onsubmit = (e) => {
    e.preventDefault();
    if (enfantsSelectionnes.size === 0) {
      alert("Sélectionne au moins un enfant.");
      return;
    }

    const intSelect = document.getElementById('intervenantSelect');
    const lieuSelect = document.getElementById('lieuSelect');
    const estRecurrent = document.getElementById('recurrentCheck').checked;

    const payload = {
      type: document.getElementById('typeSelect').value,
      date: document.getElementById('dateInput').value,
      heureDebut: document.getElementById('heureDebutInput').value,
      heureFin: document.getElementById('heureFinInput').value,
      enfantsIds: Array.from(enfantsSelectionnes),
      idIntervenant: intSelect.value,
      responsableTexte: intSelect.options[intSelect.selectedIndex].text,
      idLieu: lieuSelect.value,
      lieuTexte: lieuSelect.value ? lieuSelect.options[lieuSelect.selectedIndex].text : "",
      notes: document.getElementById('notesInput').value,
      estRecurrent: estRecurrent,
      uniteRecurrence: document.getElementById('frequenceUnite').value,
      intervalleRecurrence: 1,
      dateFinRecurrence: estRecurrent ? document.getElementById('dateFinRecurrence').value : null
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ajouterEvenement", payload: payload })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alert(`${res.nbOccurrences} événement(s) créé(s) avec succès !`);
        location.reload();
      }
    });
  };
</script>
</body>
</html>
