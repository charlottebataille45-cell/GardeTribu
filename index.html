<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garde Tribu</title>
  <style>
    :root { 
      --bg: #f4f6f8; 
      --card: #ffffff; 
      --primary: #4CAF50; 
      --border: #e2e8f0; 
      --accent: #2196F3;
      --text: #2d3748;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 12px; margin: 0; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 480px; margin: 0 auto; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; color: #4a5568; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; font-family: inherit; }
    
    /* Puces Enfants */
    .puces-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .puce-btn { padding: 6px 12px; border: 2px solid transparent; border-radius: 16px; background: #edf2f7; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.15s; user-select: none; }
    .puce-btn.selected { color: white !important; }

    /* Raccourcis temps */
    .shortcuts { display: flex; gap: 6px; margin-top: 4px; }
    .shortcut-btn { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
    .shortcut-btn:hover { background: #cbd5e0; }

    /* Accordéon */
    details { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 12px; background: #fafafa; }
    summary { font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--accent); }

    .btn-submit { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 14px; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    
    #loading { text-align: center; padding: 30px; font-weight: 600; color: #718096; }
    #app { display: none; }

    /* Timeline Preview */
    .timeline-preview { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
    .event-item { background: #edf2f7; border-left: 4px solid var(--accent); padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="card">
  <div id="loading">⏳ Chargement de Garde Tribu...</div>
  
  <div id="app">
    <form id="eventForm">
      
      <!-- Enfants (Multi-sélection / Vide par défaut) -->
      <div class="form-group">
        <label>Pour qui ?</label>
        <div class="puces-grid" id="enfantsContainer"></div>
      </div>

      <!-- Type & Responsable -->
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Type</label>
          <select id="typeSelect" required></select>
        </div>
        <div class="form-group" style="flex: 1.2;">
          <label>Responsable</label>
          <select id="intervenantSelect" required></select>
        </div>
      </div>

      <!-- Date & Raccourcis -->
      <div class="form-group">
        <label>Date</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="date" id="dateInput" required>
          <button type="button" class="shortcut-btn" onclick="setDate('aujourdhui')">Aujourd'hui</button>
          <button type="button" class="shortcut-btn" onclick="setDate('demain')">Demain</button>
        </div>
      </div>

      <!-- Heures & Durée -->
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Début</label>
          <input type="time" id="heureDebutInput" value="17:00" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Fin</label>
          <input type="time" id="heureFinInput" value="18:00" required>
        </div>
      </div>
      <div class="shortcuts" style="margin-bottom: 12px;">
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(30)">+30 min</button>
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(60)">+1h</button>
        <button type="button" class="shortcut-btn" onclick="ajouterDuree(120)">+2h</button>
        <button type="button" class="shortcut-btn" onclick="setJournee()">Journée</button>
      </div>

      <!-- Accordéon Plus d'options -->
      <details>
        <summary>+ Plus d'options (Lieu, Notes, Récurrence)</summary>
        <div style="padding-top: 10px;">
          
          <div class="form-group">
            <label>Lieu</label>
            <select id="lieuSelect"><option value="">-- Aucun --</option></select>
          </div>

          <div class="form-group">
            <label>Notes / Détails</label>
            <textarea id="notesInput" rows="2" placeholder="Précisions..."></textarea>
          </div>

          <!-- Récurrence pour BDD_Series -->
          <div style="border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="recurrentCheck" style="width: auto;" onchange="toggleRecurrenceUI()">
              Répéter cet événement (Série)
            </label>
            
            <div id="recurrenceOptions" style="display: none; margin-top: 8px; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
              <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                <select id="frequenceUnite">
                  <option value="Semaines">Chaque semaine</option>
                  <option value="Jours">Chaque jour</option>
                </select>
              </div>
              <label>Jusqu'au :</label>
              <input type="date" id="dateFinRecurrence">
            </div>
          </div>

        </div>
      </details>

      <button type="submit" class="btn-submit" id="submitBtn">Enregistrer</button>
    </form>

    <!-- Aperçu de la Timeline -->
    <div class="timeline-preview">
      <label>Aperçu du Planning</label>
      <div id="timelineContainer"></div>
    </div>
  </div>
</div>

<script>
  // ⚠️ ASSURE-TOI QUE CETTE URL EST CELLE DE TON DERNIER DÉPLOIEMENT WEB APP (VERSION EXÉCUTÉE EN TANT QUE MOI / ACCÈS TOUS)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQDj9KEekj0b3kXZlQhfuFKZa8p5bNgSkrS-oJJ6yoDpInhN2UxLV-F8xxQ2KspwrNzw/exec";
  
  let globalData = null; // Contiendra { referentiels, evenements, evenementEnfants, series }
  const enfantsSelectionnes = new Set(); 

  window.onload = () => {
    chargerPlanningData();
    setDate('aujourdhui');
  };

  /**
   * CHARGEMENT INITIAL (Un seul appel Réseau)
   */
  function chargerPlanningData() {
    fetch(`${SCRIPT_URL}?action=getPlanningData`, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(data => {
        globalData = data;
        construireFormulaire();
        afficherTimeline();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loading').innerText = "❌ Erreur de chargement. Veuillez rafraîchir.";
      });
  }

  /**
   * GENERATION DYNAMIQUE DE L'UI DEPUIS LE REFERENTIEL
   */
  function construireFormulaire() {
    const refs = globalData.referentiels;

    // 1. Boutons Enfants
    const container = document.getElementById('enfantsContainer');
    container.innerHTML = "";
    if (refs.enfants && Array.isArray(refs.enfants)) {
      refs.enfants.forEach(e => {
        if (e.actif === "Oui") {
          const btn = document.createElement('div');
          btn.className = 'puce-btn';
          btn.innerText = `${e.emoji} ${e.prenom}`;
          btn.style.borderColor = e.couleur;
          btn.style.color = e.couleur;
          btn.onclick = () => toggleEnfant(e.id, btn, e.couleur);
          container.appendChild(btn);
        }
      });
    }

    // 2. Types
    const typeSelect = document.getElementById('typeSelect');
    typeSelect.innerHTML = "";
    if (refs.types && Array.isArray(refs.types)) {
      refs.types.forEach(t => typeSelect.add(new Option(t, t)));
    }

    // 3. Lieux
    const lieuSelect = document.getElementById('lieuSelect');
    lieuSelect.innerHTML = '<option value="">-- Aucun --</option>';
    if (refs.lieux && Array.isArray(refs.lieux)) {
      refs.lieux.forEach(l => lieuSelect.add(new Option(l.nom, l.id)));
    }

    mettreAJourIntervenants();
  }

  function toggleEnfant(idEnfant, btn, couleur) {
    if (enfantsSelectionnes.has(idEnfant)) {
      enfantsSelectionnes.delete(idEnfant);
      btn.classList.remove('selected');
      btn.style.backgroundColor = 'transparent';
      btn.style.color = couleur;
    } else {
      enfantsSelectionnes.add(idEnfant);
      btn.classList.add('selected');
      btn.style.backgroundColor = couleur;
      btn.style.color = 'white';
    }
    mettreAJourIntervenants();
  }

  /**
   * CALCUL DYNAMIQUE DES RELATIONS FAMILIALES SUR LES INTERVENANTS
   */
  function mettreAJourIntervenants() {
    const select = document.getElementById('intervenantSelect');
    const valeurSelectionnee = select.value;
    select.innerHTML = '<option value="">-- Choisir --</option>';

    const refs = globalData.referentiels;
    if (!refs || !refs.intervenants || !Array.isArray(refs.intervenants)) return;

    refs.intervenants.forEach(interv => {
      const intervId = interv.id || interv.nom; 
      let libelle = interv.nom;

      // Déduction dynamique des relations depuis referentiels.json
      if (refs.relationsFamiliales && Array.isArray(refs.relationsFamiliales) && enfantsSelectionnes.size > 0) {
        let relsFound = [];
        enfantsSelectionnes.forEach(idEnfant => {
          const match = refs.relationsFamiliales.find(r => r.intervenantId === intervId && r.enfantId === idEnfant);
          if (match) relsFound.push(match.relation);
        });

        if (relsFound.length > 0) {
          const relsUniques = [...new Set(relsFound)].join(', ');
          libelle = `👤 ${interv.nom} (${relsUniques})`;
        }
      }

      select.add(new Option(libelle, intervId));
    });

    if (valeurSelectionnee) select.value = valeurSelectionnee;
  }

  /**
   * ROBUSTE : GENERATION DE TIMELINE ET PREVENTION DES ERREURS FOREACH
   */
  function genererOccurrences(donneesBrutes) {
    // Sécurité anti-crash si la variable passée n'est pas directement un tableau
    const listeEvents = Array.isArray(donneesBrutes) 
      ? donneesBrutes 
      : (donneesBrutes && Array.isArray(donneesBrutes.evenements) ? donneesBrutes.evenements : []);

    return listeEvents.map(evt => {
      return {
        id: evt.idEvenement,
        titre: evt.titre || `${evt.type} - ${evt.responsableTexte}`,
        debut: evt.debut,
        fin: evt.fin,
        lieu: evt.lieuTexte
      };
    });
  }

  function afficherTimeline() {
    const container = document.getElementById('timelineContainer');
    container.innerHTML = "";

    // Utilisation sécurisée
    const listeEvenements = globalData ? globalData.evenements : [];
    const occurrences = genererOccurrences(listeEvenements);

    if (occurrences.length === 0) {
      container.innerHTML = "<div style='font-size:0.8rem; color:#a0aec0;'>Aucun événement récent.</div>";
      return;
    }

    occurrences.slice(-5).reverse().forEach(occ => {
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<strong>${occ.titre}</strong><br><small>🕒 ${occ.debut} ➔ ${occ.fin}</small>`;
      container.appendChild(div);
    });
  }

  // --- RACCOURCIS DATES & HEURES ---
  function setDate(choix) {
    const d = new Date();
    if (choix === 'demain') d.setDate(d.getDate() + 1);
    document.getElementById('dateInput').value = d.toISOString().split('T')[0];
  }

  function ajouterDuree(minutes) {
    const hDebut = document.getElementById('heureDebutInput').value;
    if (!hDebut) return;
    const [h, m] = hDebut.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m + minutes);
    const hFin = String(d.getHours()).padStart(2, '0');
    const mFin = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('heureFinInput').value = `${hFin}:${mFin}`;
  }

  function setJournee() {
    document.getElementById('heureDebutInput').value = "08:00";
    document.getElementById('heureFinInput').value = "18:00";
  }

  function toggleRecurrenceUI() {
    const isChecked = document.getElementById('recurrentCheck').checked;
    document.getElementById('recurrenceOptions').style.display = isChecked ? 'block' : 'none';
  }

  // --- SOUMISSION DU FORMULAIRE ---
  document.getElementById('eventForm').onsubmit = (e) => {
    e.preventDefault();

    if (enfantsSelectionnes.size === 0) {
      alert("Veuillez sélectionner au moins un enfant.");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Enregistrement...";

    const intSelect = document.getElementById('intervenantSelect');
    const lieuSelect = document.getElementById('lieuSelect');
    const estRecurrent = document.getElementById('recurrentCheck').checked;

    const payload = {
      type: document.getElementById('typeSelect').value,
      date: document.getElementById('dateInput').value,
      heureDebut: document.getElementById('heureDebutInput').value,
      heureFin: document.getElementById('heureFinInput').value,
      enfantsIds: Array.from(enfantsSelectionnes),
      idIntervenant: intSelect.value,
      responsableTexte: intSelect.options[intSelect.selectedIndex].text.replace(/👤\s?/, '').split(' (')[0],
      idLieu: lieuSelect.value,
      lieuTexte: lieuSelect.value ? lieuSelect.options[lieuSelect.selectedIndex].text : "",
      notes: document.getElementById('notesInput').value,
      estRecurrent: estRecurrent,
      uniteRecurrence: document.getElementById('frequenceUnite').value,
      intervalleRecurrence: 1,
      dateFinRecurrence: estRecurrent ? document.getElementById('dateFinRecurrence').value : null
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ajouterEvenement", payload: payload })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        alert(res.message);
        location.reload();
      } else {
        alert("Erreur: " + res.message);
        btn.disabled = false;
        btn.innerText = "Enregistrer";
      }
    })
    .catch(err => {
      console.error(err);
      alert("Une erreur de communication est survenue.");
      btn.disabled = false;
      btn.innerText = "Enregistrer";
    });
  };
</script>
</body>
</html>
